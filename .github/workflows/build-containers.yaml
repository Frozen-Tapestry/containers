name: build-containers

on:
  push:
    branches:
      - prime
      - develop

permissions:
  contents: read
  packages: write

jobs:
  release-default:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: openldap
            mount_ws: openldap/2.6/debian-12
            tags: >-
              ghcr.io/frozen-tapestry/openldap:latest
              ghcr.io/frozen-tapestry/openldap:2.6
              ghcr.io/frozen-tapestry/openldap:2.6.13
              ghcr.io/frozen-tapestry/openldap:2.6.13-6
          - name: unbound
            mount_ws: unbound
            tags: >-
              ghcr.io/frozen-tapestry/unbound:latest
              ghcr.io/frozen-tapestry/unbound:1.23.0
          - name: autodiscover
            mount_ws: autodiscover-email-settings
            tags: >-
              ghcr.io/frozen-tapestry/autodiscover:latest
              ghcr.io/frozen-tapestry/autodiscover:1.4.0-20
          - name: caddy
            extra_args: --build-arg CADDY_VERSION=2.11.3
            mount_ws: docker-caddy-cloudflare
            tags: >-
              ghcr.io/frozen-tapestry/caddy-cloudflare:2.11.3
          - name: baseimage-alpine
            mount_ws: docker-baseimage-alpine
            tags: >-
              ghcr.io/frozen-tapestry/baseimage-alpine:latest
              ghcr.io/frozen-tapestry/baseimage-alpine:3.23
          - name: healthchecks
            mount_ws: docker-healthchecks
            tags: >-
              ghcr.io/frozen-tapestry/healthchecks:latest
              ghcr.io/frozen-tapestry/healthchecks:v4.2-ls347

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check if all tags exist
        id: check
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          echo "Checking tags: $TAGS"
          all_exist=true
          for t in $TAGS; do
            if ! docker manifest inspect "$t" >/dev/null 2>&1; then
              echo "Tag does not exist: $t"
              all_exist=false
            else
              echo "Tag exists: $t"
            fi
          done
          echo "all_exist=$all_exist" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} image
        if: steps.check.outputs.all_exist != 'true'
        uses: Frozen-Tapestry/container-action@v1
        with:
          login_registry: ghcr.io
          login_username: ${{ github.actor }}
          login_password: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ matrix.tags }} # space-separated list (folded above)
          dockerfile: Dockerfile
          extra_args: ${{ matrix.extra_args }}
          mount_ws: ${{ github.workspace }}/${{ matrix.mount_ws }} # per-image Dockerfile folder
          security: |
            --security-opt=seccomp=unconfined
            --security-opt=apparmor=unconfined
          push: ${{ github.ref == 'refs/heads/prime' }}
