name: build-containers

on:
  push:
    branches:
      - prime
      - develop

permissions:
  contents: read
  packages: write

jobs:
  release-default:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: openldap
            mount_ws: openldap/2.6/debian-12
            tags: >-
              ghcr.io/frozen-tapestry/openldap:latest
              ghcr.io/frozen-tapestry/openldap:2.6
          - name: unbound
            mount_ws: unbound
            tags: >-
              ghcr.io/frozen-tapestry/unbound:latest
              ghcr.io/frozen-tapestry/unbound:1.23.0
          - name: autodiscover
            mount_ws: autodiscover-email-settings
            tags: >-
              ghcr.io/frozen-tapestry/autodiscover:latest
              ghcr.io/frozen-tapestry/autodiscover:1.4.0
          - name: caddy
            mount_ws: docker-caddy-cloudflare
            tags: >-
              ghcr.io/frozen-tapestry/caddy-cloudflare:latest
              ghcr.io/frozen-tapestry/caddy-cloudflare:2.10.2
          - name: baseimage-alpine
            mount_ws: docker-baseimage-alpine
            tags: >-
              ghcr.io/frozen-tapestry/baseimage-alpine:latest
              ghcr.io/frozen-tapestry/baseimage-alpine:3.22
          - name: healthchecks
            mount_ws: docker-healthchecks
            tags: >-
              ghcr.io/frozen-tapestry/healthchecks:latest
              ghcr.io/frozen-tapestry/healthchecks:3.11.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build ${{ matrix.name }} image
        uses: Frozen-Tapestry/container-action@develop
        with:
          login_registry: ghcr.io
          login_username: ${{ github.actor }}
          login_password: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ matrix.tags }} # space-separated list (folded above)
          dockerfile: Dockerfile
          mount_ws: ${{ github.workspace }}/${{ matrix.mount_ws }} # per-image Dockerfile folder
          security: |
            --security-opt=seccomp=unconfined
            --security-opt=apparmor=unconfined
          push: ${{ github.ref == 'refs/heads/prime' }}